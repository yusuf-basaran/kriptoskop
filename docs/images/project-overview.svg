<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title description">
<title id="title">KRİPTOSKOP — proje özellikleri</title>
<desc id="description">Piyasa ve varlık arama: Fiyat, hacim, piyasa değeri ve varlık detayları.; Fiyat grafikleri: 1, 7, 30 ve 365 günlük grafik aralıkları.; Üç para birimi: USD, EUR ve TRY ile piyasa görünümü.; Favori varlıklar: Tarayıcıda saklanan kişisel takip listesi.; Fiyat alarmları: Hedef fiyat ve yön koşuluna göre alarm takibi.; Yedek veri sağlayıcısı: Sunucu API katmanı, önbellek ve failover.</desc>
